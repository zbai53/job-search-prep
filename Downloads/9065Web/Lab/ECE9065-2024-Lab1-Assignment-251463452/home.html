<!DOCTYPE html>
<html lang="en">
<style>
    
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}

.container {
    display: flex;
    width: 100%;
}

/* 左侧竖直导航栏样式 */
.sidebar {
    width: 200px;
    background-color: #333;
    color: white;
    padding: 20px;
    height: 100vh; /* 使导航栏占满整个页面高度 */
    position: fixed;
}

.sidebar ul {
    list-style-type: none;
}

.sidebar ul li {
    margin: 20px 0;
}

.sidebar ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    display: block;
    padding: 10px;
    transition: background-color 0.3s ease;
}

.sidebar ul li a:hover {
    background-color: #555;
}

/* 右侧内容区样式 */
.content {
    margin-left: 220px; /* 留出导航栏宽度的空间 */
    padding: 20px;
    width: 100%;
}

.content iframe {
    width: 100%;
    height: 100vh;
    border: none;
}

</style>
