<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Data in Table</title>
  <style>
    .table {
      width: 100%;
      border-collapse: collapse;
    }
    .th, td {
      padding: 8px;
      text-align: left;
      border: 1px solid #ddd;
    }
    .th {
      background-color: #f4f4f4;
    }
    .btnReset{
      border: 3px solid #ddd; 
      border-radius: 16px; 
      box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
      padding: 10px 20px;
      background-color: #46a905;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-left: 86%;
      margin-top: 2%;
    }

    
    @media (max-width: 1024px) {
        .top-container {
            flex-direction: column;
            align-items: center;
        }

        .carousel-container, .container1 {
            width: 90%;
            margin-right: 0;
            margin-left: 0;
        }

        .carousel {
            width: 100%;
        }

        .box1 {
            width: 100%;
            margin: 20px 0;
        }
    }

    @media (max-width: 768px) {
        .container1 {
            width: 100%;
            margin-left: 0;
        }

        .box1 {
            padding: 10%;
        }

        .title {
            margin-top: 30%;
        }
    }

    @media (max-width: 480px) {
        .box1, .box2 {
            width: 100%;
        }

        .carousel-container {
            width: 100%;
        }

        .title {
            margin-top: 20%;
            font-size: 1.5rem;
        }

        .box1 h3 {
            font-size: 1rem;
        }

        .text-t {
            font-size: 1.2rem;
        }

        .text-c {
            font-size: 1rem;
        }
    }
    
  </style>
</head>
<body>
    <h2>Computer Details</h2>

</body>
</html>
