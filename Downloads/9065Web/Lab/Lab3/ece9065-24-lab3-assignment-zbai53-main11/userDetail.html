<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            justify-content: center;

        }
        .user-details label {
            display: block;
            margin: 5px 0 2px;
        }
        .user-details input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .btnSave {
            border: 3px solid #ddd; 
            border-radius: 16px; 
            box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        .btnDelete {
            border: 3px solid #ddd; 
            border-radius: 16px; 
            box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
            padding: 10px 20px;
            background-color: #FF4136;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }


        /* For medium screens (around 1024px) */
        @media (max-width: 1024px) {
            .user-details input {
                padding: 8px; /* Slightly increase padding for better touch targets */
            }
            h2 {
                font-size: 1.4em; /* Adjust header size for readability */
            }
            .btnSave, .btnDelete {
                padding: 10px 18px; /* Adjust padding for buttons */
                font-size: 0.9em; /* Maintain readability */
                margin-right: 8px; /* Slightly adjust margin */
            }
        }

        /* For tablets */
        @media (max-width: 768px) {
            .user-details input {
                padding: 7px; /* Reduce padding slightly for smaller screens */
            }
            .btnSave, .btnDelete {
                padding: 8px 15px; /* Adjust button padding */
                font-size: 0.9em; /* Font size for buttons */
            }
        }

        /* For mobile devices */
        @media (max-width: 480px) {
            h2 {
                font-size: 1.2em; /* Smaller header for mobile */
            }
            .user-details label, .user-details input {
                font-size: 0.9em; /* Font size for labels and inputs */
            }
            .btnSave, .btnDelete {
                padding: 6px 10px; /* Further reduce button padding */
                font-size: 0.8em; /* Font size for buttons */
                margin-right: 5px; /* Adjust margin */
            }
        }
    </style>
</head>
<body>

    
        <h2>User Details</h2>
        <div id="user-details" class="user-details">
            
        </div>
        <button onclick="saveUserDetails()" class="btnSave">Save Changes</button>
        <button onclick="deleteUser('${userId}')" id="btnDelete"  class="btnDelete">Delete User</button>
        <div id="searchResults"></div>
        <div id="modelList"></div>
        <script src="js/lab3-p1.js"></script>
        <script>
           
            const urlParams = new URLSearchParams(window.location.search);
            const userIdFromUrl = urlParams.get('userId'); 
            userId = userIdFromUrl; 
            loadUserDetails(userId); 
            document.getElementById('btnDelete').onclick = () => deleteUser(userId);
        </script>
    </body>
</html>
