<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Detail</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    /* .container {
      display: flex;
      width: 80%;
      height: 100vh;
    } */

    .model-details{
        width: 140%;
    }

    .model-details label{
        display: block;
        margin: 5px 0 2px;
    }
    .model-details input {
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
        width: 70%;
    }
    .btnSave {
        border: 3px solid #ddd; 
        border-radius: 16px; 
        box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
        padding: 10px 20px;
        background-color: #007BFF;
        color: #fff;
        border: none;
        cursor: pointer;
        margin-right: 10px;
        justify-content: center;
    }
    .btnDelete {
        border: 3px solid #ddd; 
        border-radius: 16px; 
        box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
        padding: 10px 20px;
        background-color: #FF4136;
        color: #fff;
        border: none;
        cursor: pointer;
        margin-right: 10px;
        /* margin-top: 10%; */
        justify-content: center;
    }

    /* Larger tablets and small laptops (max-width: 1024px) */
    @media (max-width: 1024px) {
      .model-details {
        width: 80%;
      }
      .model-details input {
        width: 80%;
      }
      button.btnSave,
      button.btnDelete {
        padding: 12px;
        font-size: 0.8rem;
        width: 25%;
      }
    }


    /* Medium screens (tablets, max-width: 768px) */
    @media (max-width: 768px) {
      .model-details {
        width: 90%;
      }
      button.btnSave,
      button.btnDelete {
        width: 20%;
        margin-bottom: 10px;
      }
    }

    /* Small screens (mobile devices, max-width: 480px) */
    @media (max-width: 480px) {
      h2 {
        font-size: 1.5rem;
      }
      .model-details label {
        font-size: 0.9rem;
      }
      .model-details input {
        padding: 6px;
        font-size: 0.9rem;
      }
      button.btnSave,
      button.btnDelete {
        padding: 8px;
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
 
      <h2>Computer Details</h2>
      <div class="model-details" id="model-details">
        
      </div>
      <button class="btnSave" onclick="saveModel()">Save</button>
      <button class="btnDelete" onclick="deleteModel()">Delete</button>

      <div id="searchResults"></div>
      <div id="modelList"></div>
    
  <script src="js/lab3-p1_3.js"></script>
  <script src="js/lab3-p1.js"></script>
</body>
</html>
