<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f4f4f4;
    }
    .btnReset{
      border: 3px solid #ddd; 
      border-radius: 16px; 
      box-shadow: 10px 5px 10px rgba(10, 10, 10, 0.1);
      padding: 10px 20px;
      background-color: #46a905;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-left: 86%;
      margin-top: 2%;
    }
    @media (max-width: 1024px) {
      .btnReset {
        margin-left: 80%; 
      }
      table {
        width: 95%;
        margin: 0 auto;
      }
      th, td {
        padding: 6px;
        font-size: 0.9rem;
      }
    }

    /* Small screens (max-width: 768px) */
    @media (max-width: 768px) {
      .btnReset {
        margin-left: 70%; 
        margin-top: 4%;
        padding: 8px 16px;
        font-size: 0.9rem;
      }
      table {
        width: 100%;
      }
      th, td {
        padding: 5px;
        font-size: 0.85rem;
      }
    }

    /* Extra small screens (max-width: 480px) */
    @media (max-width: 480px) {
      .btnReset {
        width: 80%;
        margin: 2% auto;
        padding: 8px 16px;
        font-size: 0.85rem;
      }
      table {
        width: 80%;
        font-size: 0.8rem;
      }
      th, td {
        padding: 4px;
        font-size: 0.8rem;
      }
      th, td {
        display: block;
        width: 80%;
        box-sizing: border-box;
      }
      th, td:before {
        content: attr(data-label); 
        font-weight: bold;
        width: 50%;
        float: left;
      }
    }
    
    
  </style>
</head>
<body>
  <table id="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Address</th>
        <th>City</th>
        <th>State</th>
        <th>Zip</th>
        <th>Portfolio</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <div id="searchResults"></div>
    <div id="modelList">
    </div>
  <button onclick="resetData()" class="btnReset">resetData</button>
  <script src="js/lab3-p1.js"></script>
</body>
</html>
